version: 1
product: NoFeedSocial
bundleID: tech.stupid.StupidSocial
deploymentTarget: "18.0"
infoPath: Info.plist
entitlementsPath: App.entitlements
capabilities:
  - entitlementKey: com.apple.developer.ubiquity-kvstore-identifier
    type: ICLOUD
  - entitlementKey: aps-environment
    type: PUSH_NOTIFICATIONS
  - entitlementKey: com.apple.security.application-groups
    type: APP_GROUPS
  - entitlementKey: com.apple.developer.siri
    type: SIRIKIT
iconPath: Resources/AppIcon.appiconset/Icon-1024.png
resources:
  - Resources/XBadge.png
  - Resources/XBadge@2x.png
  - Resources/XBadge@3x.png
  - Resources/FarcasterBadge.png
  - Resources/FarcasterBadge@2x.png
  - Resources/FarcasterBadge@3x.png
  - Resources/InstagramBadge.png
  - Resources/InstagramBadge@2x.png
  - Resources/InstagramBadge@3x.png
  - Resources/SpotifyBadge.png
  - Resources/SpotifyBadge@2x.png
  - Resources/SpotifyBadge@3x.png
  - Resources/BlueskyBadge.png
  - Resources/BlueskyBadge@2x.png
  - Resources/BlueskyBadge@3x.png
  - Resources/GitHubBadge.png
  - Resources/GitHubBadge@2x.png
  - Resources/GitHubBadge@3x.png
  - Resources/ApronBadge.png
  - Resources/ApronBadge@2x.png
  - Resources/ApronBadge@3x.png
  - Resources/TelegramBadge.png
  - Resources/TelegramBadge@2x.png
  - Resources/TelegramBadge@3x.png
extensions:
  - product: NoFeedSocialNotificationService
    bundleID: tech.stupid.StupidSocial.NotificationService
    infoPath: NotificationService/Info.plist
    entitlementsPath: NotificationService/NotificationService.entitlements
    capabilities:
      - entitlementKey: com.apple.security.application-groups
        type: APP_GROUPS
