name = "stupid-push-relay"
main = "src/index.ts"
compatibility_date = "2026-07-14"
workers_dev = false
preview_urls = false
routes = [{ pattern = "push.stupidtech.net", custom_domain = true }]

[vars]
APNS_TOPIC = "tech.stupid.StupidSocial"
APNS_KEY_ID = "U7W6CW4B57"
APNS_TEAM_ID = "6JKMV57Y77"
# RELAY_SECRET and APNS_PRIVATE_KEY are secrets.

[[durable_objects.bindings]]
name = "SCHEDULED_PUSHES"
class_name = "ScheduledPushes"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["ScheduledPushes"]

[observability]
enabled = true
