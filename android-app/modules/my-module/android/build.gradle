plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'net.stupidtech.socialvalidation'
version = '0.1.0'

dependencies {
  implementation 'androidx.webkit:webkit:1.14.0'
}

android {
  namespace "net.stupidtech.socialvalidation.bridge"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
  }
  lintOptions {
    abortOnError false
  }
}
